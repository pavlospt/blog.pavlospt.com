baseURL = "https://blog.pavlospt.com/"
locale = "en"
title = "Solid Guacamole"
theme = "blowfish"

[params]
  description = "Thoughts on Android, Kotlin, and software engineering"
  showDate = true
  showReadingTime = true
  showWordCount = true
  showTaxonomies = true
  defaultTheme = "auto"

  [params.homepage]
    layout = "profile"
    showRecent = true
    showRecentTitle = "Recent Posts"
    showMoreLink = true
    showMoreLinkDest = "/posts/"

  [params.author]
    name = "Pavlos-Petros Tournaris"
    image = ""
    headline = "Android Engineer"
    bio = "Writing about Kotlin, Compose, and building things that work."

    [params.author.links]
      github = "https://github.com/pavlospt"
      linkedin = "https://linkedin.com/in/pavlospt"

[pagination]
  pagerSize = 5

[outputs]
  home = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = true
