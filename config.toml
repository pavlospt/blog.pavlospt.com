baseURL = "https://blog.pavlospt.com/"
languageCode = "en-us"
title = "Solid Guacamole"
theme = "PaperMod"
paginate = 5

[params]
  author = "Pavlos-Petros Tournaris"
  description = "Thoughts on Android, Kotlin, and software engineering"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  defaultTheme = "auto"

  [params.homeInfoParams]
    Title = "Hi, I'm Pavlos"
    Content = "Android engineer. Writing about Kotlin, Compose, and building things that work."

  [params.profileMode]
    enabled = false

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/pavlospt"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/pavlospt"

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true
